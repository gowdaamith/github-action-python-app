name: python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:  
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          
      - name: Insall dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
            ruff check .
  test: 
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup python
        uses: actions/setup-python@v7
        with: 
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: | 
          python -m pytest

  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository 
        uses: actions/checkout@v7
        
      - name: Create a build directory
        run: mkdir -p build

      - name: Copy application file to the build dir
        run : |
          cp -r app build/
          cp requirements.txt build/
      
      - name: Create zip file
        run: |
          gzip -r employee-api.zip build/

      - name: upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: employee-api
          path: employee-api.zip
          
          
        
